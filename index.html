<!-- Temporizador con Bootstrap -->
<div class="container text-center my-4">
  <h2 class="mb-3">Cuenta regresiva para el gran día</h2>
  <div id="temporizador" class="numeros display-4 fw-bold text-success"></div>
</div>

<script>
  // Fecha objetivo: 29 de agosto de 2026
  const fechaEvento = new Date("Aug 29, 2026 10:00:00").getTime();

  const temporizador = setInterval(function() {
    const ahora = new Date().getTime();
    const diferencia = fechaEvento - ahora;

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

    document.getElementById("temporizador").innerHTML =
      dias + "d " + horas + "h " + minutos + "m " + segundos + "s ";

    if (diferencia < 0) {
      clearInterval(temporizador);
      document.getElementById("temporizador").innerHTML = "¡El gran día ha llegado!";
    }
  }, 1000);
</script>
